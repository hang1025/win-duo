<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"
    />
    <title>Win Duo</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #16171b;
        --card: #1e2026;
        --line: #2b2e36;
        --text: #e8eaf0;
        --muted: #9aa0ae;
        --accent: #5b8cff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 18px 18px 28px;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        user-select: none;
      }
      h1 {
        margin: 0 0 2px;
        font-size: 16px;
        font-weight: 600;
      }
      .sub {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 12px;
      }
      section {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 12px;
      }
      section > h2 {
        margin: 0 0 10px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .row { margin-bottom: 12px; }
      .row:last-child { margin-bottom: 0; }
      .row header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
      }
      .row label { font-size: 13px; }
      .row .value {
        font-variant-numeric: tabular-nums;
        color: var(--accent);
        font-size: 12px;
      }
      .row .hint {
        color: var(--muted);
        font-size: 11.5px;
        margin-top: 2px;
      }
      input[type="range"] {
        width: 100%;
        margin: 6px 0 0;
        accent-color: var(--accent);
      }
      .switches { display: flex; flex-direction: column; gap: 10px; }
      .switch {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .switch span { font-size: 13px; }
      input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
      }
      input[type="text"],
      select {
        background: #14151a;
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 6px;
        padding: 5px 8px;
        font: inherit;
        font-size: 12px;
        min-width: 150px;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }
      button {
        flex: 1;
        padding: 9px 12px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: #23262d;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      button:hover { border-color: #3c414d; }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #0b1220;
        font-weight: 600;
      }
      footer {
        color: var(--muted);
        font-size: 11.5px;
        margin-top: 14px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1 data-i18n="settings.title"></h1>
    <p class="sub" data-i18n="settings.subtitle"></p>

    <section id="tracking-section">
      <h2 data-i18n="settings.tracking"></h2>
      <div class="switches">
        <div class="switch">
          <span data-i18n="params.angleSource.label"></span>
          <select data-key="angleSource">
            <option value="camera" data-i18n="params.angleSource.camera"></option>
            <option value="sweep" data-i18n="params.angleSource.sweep"></option>
          </select>
        </div>
        <label class="switch">
          <span data-i18n="params.showAngleReadout.label"></span>
          <input type="checkbox" data-key="showAngleReadout" />
        </label>
      </div>
      <div class="hint" data-i18n="params.angleSource.hint"></div>
    </section>

    <section>
      <h2 data-i18n="settings.trigger"></h2>
      <div class="switches">
        <label class="switch">
          <span data-i18n="params.enabled.label"></span>
          <input type="checkbox" data-key="enabled" />
        </label>
        <label class="switch">
          <span data-i18n="params.launchAtLogin.label"></span>
          <input type="checkbox" data-key="launchAtLogin" />
        </label>
        <div class="switch">
          <span data-i18n="params.displayMode.label"></span>
          <select data-key="displayMode">
            <option value="primary" data-i18n="params.displayMode.primary"></option>
            <option value="cursor" data-i18n="params.displayMode.cursor"></option>
          </select>
        </div>
        <div class="switch">
          <span data-i18n="params.hotkey.label"></span>
          <input type="text" data-key="hotkey" spellcheck="false" />
        </div>
      </div>
    </section>

    <section id="angle-section"><h2 data-i18n="settings.angle"></h2></section>
    <section id="optics-section"><h2 data-i18n="settings.optics"></h2></section>
    <section id="motion-section"><h2 data-i18n="settings.motion"></h2></section>

    <div class="actions">
      <button class="primary" id="preview" data-i18n="settings.preview"></button>
      <button id="reset" data-i18n="settings.reset"></button>
    </div>

    <footer data-i18n="settings.footer"></footer>

    <script src="../shared/strings.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
